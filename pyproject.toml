[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logManager"
version = "1.1.4"
authors = [
    {name = "Mark Hendriksen", email = "your.email@example.com"}
]
description = "A thread-safe logging manager for Python applications"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "colorlog>=6.0.0"
]

[project.urls]
"Homepage" = "https://github.com/hendriksen-mark/logManager"
"Repository" = "https://github.com/hendriksen-mark/logManager.git"

[tool.setuptools]
packages = ["logManager"]

[tool.setuptools.package-dir]
logManager = "log_manager"
